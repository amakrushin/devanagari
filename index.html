<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="devanagari">
<title>devanagari — Nepali alphabet trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <p id="loading">Loading…</p>

  <section id="screen-home" hidden>
    <header class="home-header">
      <h1 class="brand">devanagari</h1>
      <p class="tagline">Nepali alphabet trainer</p>
    </header>
    <p id="home-stats" class="home-stats" hidden></p>
    <div id="group-list" class="group-list"></div>
    <button id="btn-start" class="btn btn-primary">Start session</button>
    <footer class="home-footer">
      <span id="app-version"></span>
      <button id="btn-share" class="btn-link">Share app</button>
      <button id="btn-export" class="btn-link">Save progress</button>
      <button id="btn-import" class="btn-link">Load progress</button>
      <button id="btn-reset" class="btn-link">Reset progress</button>
    </footer>
    <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" hidden>
  </section>

  <section id="screen-quiz" hidden>
    <header class="quiz-header">
      <button id="btn-quit" class="btn-icon" aria-label="End session">&times;</button>
      <span id="quiz-remaining"></span>
    </header>
    <div id="quiz-body">
      <div id="quiz-stage"></div>
      <div id="quiz-actions"></div>
    </div>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
